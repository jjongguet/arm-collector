name: CI

on:
  pull_request:
  push:
    branches: [main, dev]


permissions:
  contents: read

jobs:
  test:
    # JJO-584: public-repo PR code must not run on the self-hosted k3s runner.
    # push (main, dev) keeps arc-ci; pull_request builds run GitHub-hosted.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'arc-ci' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
